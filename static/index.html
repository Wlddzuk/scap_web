<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipper | Article to TikTok Video</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="noise-bg"></div>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">▲</span>
                    <h1>Clipper</h1>
                </div>
                <div class="header-stats">
                    <span class="stat" id="total-count">0 articles</span>
                    <span class="stat" id="video-count">0 videos</span>
                    <span class="stat" id="carousel-count">0 carousels</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- URL Scraper Form -->
            <div class="url-scraper-form">
                <h3>Paste an article URL</h3>
                <p>Turn any article into a TikTok-ready video with AI</p>
                <form id="url-form" onsubmit="scrapeUrl(event)">
                    <div class="url-input-group">
                        <input type="url" id="url-input" placeholder="https://example.com/article..." required>
                        <button type="submit" class="btn btn-primary" id="scrape-btn">
                            Scrape
                        </button>
                    </div>
                </form>
                <label class="hook-toggle" for="video-hook-toggle" title="When on, the 5-second opening uses a real AI video clip from FAL (slower, costs more, more cinematic). When off, it's 4 stills with a Ken Burns zoom.">
                    <input type="checkbox" id="video-hook-toggle" onchange="onHookToggleChange()">
                    <span class="hook-toggle-track"><span class="hook-toggle-thumb"></span></span>
                    <span class="hook-toggle-label">
                        <strong>AI video hook</strong>
                        <span class="hook-toggle-hint">5s motion clip vs 4 stills · slower, costs more · matches image style</span>
                    </span>
                </label>
            </div>

            <!-- Progress Banner (shows during processing) -->
            <div class="progress-banner-container">
                <div class="progress-banner hidden" id="progress-banner">
                    <div class="progress-spinner"></div>
                    <span class="progress-text" id="progress-text">Processing...</span>
                </div>
            </div>

            <!-- Search Bar (hidden when no articles) -->
            <div class="search-bar hidden" id="search-bar">
                <span class="search-icon">&#x1F50D;</span>
                <input type="text" id="search-input" placeholder="Search articles..." oninput="filterArticles()">
            </div>

            <!-- Section header -->
            <div class="section-header hidden" id="section-header">
                <span class="section-title" id="section-title">All articles</span>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">&#x1F4F0;</div>
                <h2>No articles yet</h2>
                <p>Paste a URL above to scrape your first article</p>
                <span class="empty-hint">Tip: You can also paste URLs via the Discord bot.</span>
            </div>

            <!-- Loading Skeleton -->
            <div class="skeleton-container" id="loading-skeleton">
                <div class="skeleton-card">
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line meta"></div>
                    <div class="skeleton-badges">
                        <div class="skeleton-badge"></div>
                        <div class="skeleton-badge"></div>
                    </div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line meta"></div>
                    <div class="skeleton-badges">
                        <div class="skeleton-badge"></div>
                    </div>
                </div>
            </div>

            <!-- Articles List -->
            <div class="articles-container hidden" id="articles-container">
                <!-- Articles will be rendered here by JavaScript -->
            </div>
        </main>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toast-container"></div>
    </div>

    <!-- Background Glows -->
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <script src="/static/anime.min.js"></script>
    <script src="/static/app.js"></script>
</body>

</html>
