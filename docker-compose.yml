services:
  clipper:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - DATABASE_URI=sqlite:////app/instance/database.db
    volumes:
      - ./instance:/app/instance
      - ./static/videos:/app/static/videos
      - ./static/carousels:/app/static/carousels
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
