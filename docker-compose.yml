services:
  clipper:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URI=sqlite:////app/instance/database.db
    volumes:
      - ./instance:/app/instance
      - ./static/videos:/app/static/videos
      - ./static/carousels:/app/static/carousels
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - clipper
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
